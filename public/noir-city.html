<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Black City</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}.app{position:fixed;inset:0;display:grid;place-items:center;background:#000}.board{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#000}.city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transform:scale(1);transform-origin:75% 59%;transition:transform 1.15s cubic-bezier(.75,0,.18,1),opacity .35s .75s}.inside .city{transform:scale(3.25);opacity:0}.interior{position:absolute;inset:0;opacity:0;transform:scale(1.1);transition:opacity .45s .75s,transform 1s .65s cubic-bezier(.2,.8,.2,1);pointer-events:none}.inside .interior{opacity:1;transform:scale(1);pointer-events:auto}.interior svg{width:100%;height:100%;display:block}.line{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.fill{fill:#fff}.wheel{transform-origin:960px 515px}.ballOrbit{transform-origin:960px 515px}.spinning .wheel{animation:wheel 3.2s cubic-bezier(.12,.65,.15,1)}.spinning .ballOrbit{animation:orbit 3.2s cubic-bezier(.1,.68,.15,1)}.spinning .camera{animation:camera 3.2s ease-in-out}.ball{transform-origin:center;animation:none}.spinning .ball{animation:bounce .18s 2.1s 5 alternate}.controls{position:absolute;inset:0;pointer-events:none}.button{position:absolute;pointer-events:auto;border:3px solid #fff;border-radius:0;background:#000;color:#fff;padding:12px 18px;font:800 clamp(10px,1vw,14px)/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:.15s}.button:hover,.button:focus-visible{background:#fff;color:#000;outline:0}.enter{left:69.5%;top:51%;width:9.5%;height:14%;padding:0;background:transparent;color:transparent;border-color:transparent}.enter:hover,.enter:focus-visible{border-color:#fff;background:rgba(0,0,0,.7);color:#fff}.enter:after{content:'ENTER';display:grid;place-items:center;width:100%;height:100%}.spin{left:50%;bottom:9%;transform:translateX(-50%);display:none}.back{left:3%;bottom:6%;display:none}.inside .enter{display:none}.inside .spin,.inside .back{display:block}.label{position:absolute;left:3%;top:5%;font:800 clamp(10px,1vw,14px)/1 Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase}.hint{position:absolute;right:3%;bottom:6%;font:700 clamp(9px,.8vw,12px)/1.3 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:right}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:10;font:700 11px/1 Arial,sans-serif;letter-spacing:.25em;transition:opacity .3s}.ready .loading{opacity:0;pointer-events:none}
@keyframes wheel{to{transform:rotate(1260deg)}}@keyframes orbit{0%{transform:rotate(0) scale(1)}75%{transform:rotate(-1460deg) scale(.9)}100%{transform:rotate(-1540deg) scale(.78)}}@keyframes bounce{to{transform:translateY(14px)}}@keyframes camera{0%,100%{transform:scale(1)}45%{transform:scale(1.12) translate(-2%,1%)}}
@media(max-width:700px) and (orientation:portrait){.board{width:100vw;height:56.25vw}.app{align-content:center}.button{padding:9px 11px;border-width:2px}.label{top:-55%;left:5%}.hint{bottom:-54%;right:5%}.back{left:5%;bottom:-48%}.spin{bottom:-48%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="app" id="app"><div class="loading">DRAWING THE CITY</div><section class="board" id="board">
<img class="city" id="city" src="/noir/city-line.png" alt="A black city drawn in white lines">
<div class="interior"><svg viewBox="0 0 1600 900" aria-label="Casino roulette"><rect width="1600" height="900" fill="#000"/><g class="camera">
<path class="line" d="M90 150H1510M180 150V720M1420 150V720M180 720H1420M390 150V570M1210 150V570"/><path class="line" d="M180 260H390M1210 260H1420"/>
<g transform="translate(960 515) skewX(-12) scale(1 .58) translate(-960 -515)"><ellipse class="line" cx="960" cy="515" rx="420" ry="345"/><g class="wheel"><circle class="line" cx="960" cy="515" r="300"/><circle class="line" cx="960" cy="515" r="215"/><path class="line" d="M960 215V815M660 515H1260M748 303L1172 727M1172 303L748 727M683 400L1237 630M845 238L1075 792M683 630L1237 400M845 792L1075 238"/><circle class="line" cx="960" cy="515" r="75"/><circle class="fill" cx="960" cy="515" r="14"/></g><g class="ballOrbit"><circle class="ball fill" cx="960" cy="198" r="19"/></g></g>
<path class="line" d="M0 760Q420 650 800 770T1600 735"/></g></svg></div>
<div class="controls"><div class="label">Black City</div><div class="hint" id="hint">The white door is open</div><button class="button enter" id="enter" aria-label="Enter the casino"></button><button class="button spin" id="spin">Spin</button><button class="button back" id="back">← City</button></div>
</section></main><script>
const app=document.querySelector('#app'),city=document.querySelector('#city'),enter=document.querySelector('#enter'),spin=document.querySelector('#spin'),back=document.querySelector('#back'),hint=document.querySelector('#hint');
function ready(){app.classList.add('ready')}city.complete?ready():city.addEventListener('load',ready);city.addEventListener('error',()=>{document.querySelector('.loading').textContent='IMAGE FAILED TO LOAD'});
enter.onclick=()=>{app.classList.add('inside');hint.textContent='The wheel is waiting'};back.onclick=()=>{app.classList.remove('inside','spinning');hint.textContent='The white door is open'};spin.onclick=()=>{if(app.classList.contains('spinning'))return;app.classList.add('spinning');spin.disabled=true;hint.textContent='The ball chooses';setTimeout(()=>{app.classList.remove('spinning');spin.disabled=false;hint.textContent='Spin again'},3350)};
</script></body></html>
