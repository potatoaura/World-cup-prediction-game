<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000">
<title>The White City — a study in chance</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}body{font-family:Arial,sans-serif}
.stage{position:fixed;inset:0;background:#000;isolation:isolate}.shot{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .8s ease,transform 6s cubic-bezier(.16,.7,.2,1);filter:contrast(1.12)}.shot.active{opacity:1;transform:scale(1)}
.city.active{animation:drift 10s ease-in-out infinite alternate}.door{transform-origin:51% 62%}.door.active{animation:approach 1.55s cubic-bezier(.7,0,.2,1) both}.wheel{transform-origin:61% 55%}.wheel.active{animation:wheelcam 7s ease-in-out infinite alternate}.macro{transform-origin:67% 43%}.macro.active{animation:macrocam 3.8s cubic-bezier(.2,.7,.2,1) both}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.085;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");mix-blend-mode:screen}
.iris{position:absolute;inset:-5%;pointer-events:none;box-shadow:inset 0 0 0 0 #000;transition:box-shadow .75s}.iris.close{box-shadow:inset 0 0 0 52vmax #000}
.title{position:absolute;left:max(18px,4vw);top:max(18px,4vh);font:800 clamp(10px,1vw,13px)/1 Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;text-shadow:0 1px #000}.chapter{position:absolute;right:max(18px,4vw);top:max(18px,4vh);font:italic clamp(13px,1.4vw,19px)/1 Georgia,serif;text-shadow:0 1px #000}
.action{position:absolute;z-index:4;border:1px solid #fff;background:#000;color:#fff;padding:11px 16px;font:800 10px/1 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.2s}.action:hover,.action:focus-visible{background:#fff;color:#000;outline:0}.enter{left:60%;top:46%}.spin{left:57%;top:45%;display:none}.back{left:max(18px,4vw);bottom:max(18px,4vh);display:none}.hint{position:absolute;left:50%;bottom:max(18px,4vh);transform:translateX(-50%);padding:8px 12px;background:#000;border:1px solid #fff;white-space:nowrap;font:700 9px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;transition:.35s}.busy .action{pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.spinning .flash{animation:flash 3.6s ease}.spinning .wheel.active{animation:spinpush 3.6s cubic-bezier(.15,.65,.12,1)}
@keyframes drift{to{transform:scale(1.07) translate(-.7%,.5%)}}@keyframes approach{from{transform:scale(1.13)}to{transform:scale(1)}}@keyframes wheelcam{to{transform:scale(1.06) translate(-1%,1%)}}@keyframes macrocam{from{transform:scale(1.18) translate(3%,-2%)}to{transform:scale(1)}}@keyframes spinpush{0%{transform:scale(1)}45%{transform:scale(1.18) rotate(-1.2deg)}100%{transform:scale(1.03)}}@keyframes flash{0%,46%,58%,100%{opacity:0}50%{opacity:.92}54%{opacity:.1}}
@media(max-width:700px){.shot{inset:-5%;width:110%;height:110%}.city{object-position:58% center}.door{object-position:50% center}.wheel{object-position:62% center}.macro{object-position:67% center}.enter{left:50%;top:52%;transform:translateX(-50%)}.spin{left:50%;top:54%;transform:translateX(-50%)}.chapter{display:none}.hint{width:74%;white-space:normal;text-align:center;line-height:1.35}.title{letter-spacing:.18em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="stage" id="stage">
<img class="shot city active" src="/noir/city.png" alt="A northern forest city and its mysterious casino">
<img class="shot door" src="/noir/entrance.png" alt="The monumental casino entrance">
<img class="shot wheel" src="/noir/roulette.png" alt="An oblique view of a roulette wheel">
<img class="shot macro" src="/noir/ball.png" alt="The roulette ball suspended above the track">
<div class="grain"></div><div class="flash"></div><div class="iris" id="iris"></div>
<div class="title">The White City</div><div class="chapter">A study in chance</div>
<button class="action enter" id="enter">Enter</button><button class="action spin" id="spin">Spin</button><button class="action back" id="back">← City</button>
<div class="hint" id="hint">The house in the forest is awake</div>
</main><script>
const stage=document.querySelector('#stage'),shots=[...document.querySelectorAll('.shot')],enter=document.querySelector('#enter'),spin=document.querySelector('#spin'),back=document.querySelector('#back'),hint=document.querySelector('#hint'),iris=document.querySelector('#iris');let scene=0,busy=false;
function cut(next,delay=560){if(busy)return;busy=true;stage.classList.add('busy');iris.classList.add('close');setTimeout(()=>{shots.forEach((s,i)=>s.classList.toggle('active',i===next));scene=next;iris.classList.remove('close');setTimeout(()=>{busy=false;stage.classList.remove('busy')},780)},delay)}
enter.onclick=()=>{cut(1);enter.style.display='none';hint.textContent='The door has no handle';setTimeout(()=>{cut(2,300);spin.style.display='block';back.style.display='block';hint.textContent='Touch the wheel'},2100)};
spin.onclick=()=>{if(busy)return;busy=true;stage.classList.add('busy','spinning');spin.style.display='none';hint.textContent='Nothing moves. Everything changes.';setTimeout(()=>{shots.forEach((s,i)=>s.classList.toggle('active',i===3));scene=3},1850);setTimeout(()=>{shots.forEach((s,i)=>s.classList.toggle('active',i===2));scene=2;stage.classList.remove('spinning','busy');spin.style.display='block';hint.textContent='Again?' ;busy=false},4200)};
back.onclick=()=>{if(busy)return;cut(0,380);spin.style.display='none';back.style.display='none';enter.style.display='block';hint.textContent='The house in the forest is awake'};
</script></body></html>
